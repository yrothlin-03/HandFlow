seed: 42

# model_config: ../models/temporal_unet_1d.yaml
model_config: ../models/mdit.yaml

data:
  root: datasets/preprocessed/handx_v2
  batch_size: 32
  num_workers: 4
  use_paraphrases: true
  normalize_motion: true
  normalize_text: false
  drop_last_train: true
  pin_memory: true

training:
  representation: mano_6d
  epochs: 5
  max_steps: 2000
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  criterion: mse
  cfg_dropout: 0.1
  grad_clip: 1.0
  log_every: 500
  log_level: INFO

generation:
  num_steps: 50
  guidance_scale: 2.0
  sample_index: 0
